name: Verify public publication boundary
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node test/public-boundary.cjs
      - run: node tools/check-public-boundary.cjs
